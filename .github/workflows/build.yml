name: Build Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version to publish (for example v0.1.0)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run parser and UI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name KanWidget kan_widget.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $Exe = (Resolve-Path 'dist/KanWidget/KanWidget.exe').Path
          $WorkingDirectory = Split-Path -Parent $Exe
          $Process = Start-Process -FilePath $Exe -WorkingDirectory $WorkingDirectory -PassThru
          Start-Sleep -Seconds 8
          $Process.Refresh()
          if ($Process.HasExited) {
            throw "Packaged KanWidget.exe exited early with code $($Process.ExitCode)."
          }
          Stop-Process -Id $Process.Id -Force
          Write-Host "Packaged Windows executable started and stayed alive."

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/KanWidget/*' -DestinationPath 'KanWidget-Windows.zip' -Force
          $Hash = (Get-FileHash -LiteralPath 'KanWidget-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  KanWidget-Windows.zip" | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KanWidget-Windows
          path: |
            KanWidget-Windows.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: main
          files: |
            KanWidget-Windows.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
